<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MY CLOSET</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0d;--surface:#1a1917;--surface2:#242220;--border:#2e2c2a;--text:#f0ede8;--muted:#7a7672;--accent:#e8c4a0;--accent2:#c4956a;--tag-bg:#2a2724;--danger:#c47a6a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
nav{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:var(--bg);}
.nav-tab{flex:1;padding:16px 8px;text-align:center;font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.page{display:none;padding:20px 16px 80px;max-width:480px;margin:0 auto;}
.page.active{display:block;}
.sec-title{font-family:'DM Serif Display',serif;font-size:1.6rem;font-style:italic;color:var(--accent);margin-bottom:4px;}
.sec-sub{font-size:0.75rem;color:var(--muted);letter-spacing:0.08em;margin-bottom:20px;}

/* 날씨 */
.weather-strip{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.w-icon{font-size:2rem;}.w-info{flex:1;}
.w-temp{font-size:1.4rem;font-weight:300;}.w-desc{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.w-badge{background:var(--tag-bg);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:0.72rem;color:var(--accent);white-space:nowrap;}

/* 칩 */
.chip-label{font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;margin-top:16px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);font-size:0.78rem;color:var(--muted);cursor:pointer;transition:all .2s;background:var(--tag-bg);font-family:'DM Sans',sans-serif;}
.chip:hover{border-color:var(--accent2);color:var(--accent2);}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#0f0e0d;font-weight:500;}

/* 컬러 칩 */
.color-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.color-chip{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;position:relative;flex-shrink:0;}
.color-chip.on{border-color:var(--accent);transform:scale(1.18);}
.color-chip.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:white;text-shadow:0 0 3px rgba(0,0,0,0.9);}

.free-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:0.85rem;color:var(--text);outline:none;resize:none;margin-top:16px;transition:border-color .2s;}
.free-input:focus{border-color:var(--accent2);}
.free-input::placeholder{color:var(--muted);}
.btn-big{width:100%;margin-top:16px;padding:15px;background:var(--accent);color:#0f0e0d;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-big:hover{background:var(--accent2);}
.btn-big:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:10px 16px;margin:0;font-size:0.75rem;width:auto;}

/* 추천 결과 */
.result-area{margin-top:24px;}
.r-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px;animation:up .4s ease forwards;opacity:0;}
@keyframes up{to{opacity:1;transform:none;}from{opacity:0;transform:translateY(12px);}}
.r-card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.r-card-title{font-family:'DM Serif Display',serif;font-size:1.05rem;font-style:italic;}
.r-occasion{font-size:0.65rem;letter-spacing:0.12em;color:var(--accent2);text-transform:uppercase;}
.r-photo{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;}
.r-photo-placeholder{width:100%;aspect-ratio:4/5;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:3rem;}
.r-body{padding:14px 16px;}
.r-colors{display:flex;gap:5px;margin-bottom:10px;align-items:center;}
.r-color-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);flex-shrink:0;}
.r-tags{display:flex;flex-wrap:wrap;gap:5px;}
.r-tag{padding:3px 10px;border-radius:10px;background:var(--tag-bg);font-size:0.68rem;color:var(--muted);border:1px solid var(--border);}
.r-tip{font-size:0.78rem;color:var(--accent2);line-height:1.6;padding-top:10px;margin-top:10px;border-top:1px solid var(--border);}

/* 옷장 */
.closet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.closet-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;}
.closet-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;}
.closet-img-placeholder{width:100%;aspect-ratio:3/4;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--muted);}
.closet-info{padding:10px 12px;}
.closet-name{font-size:0.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.closet-colors{display:flex;gap:4px;margin-top:5px;}
.closet-color-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);}
.closet-tags-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.closet-tag{padding:2px 7px;border-radius:6px;background:var(--tag-bg);font-size:0.6rem;color:var(--muted);border:1px solid var(--border);}
.closet-del{position:absolute;top:8px;right:8px;background:rgba(15,14,13,0.85);border:none;border-radius:50%;width:26px;height:26px;color:var(--danger);font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* 추가 폼 */
.add-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
.field-label{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;margin-top:14px;}
.field-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:0.84rem;color:var(--text);outline:none;transition:border-color .2s;}
.field-input:focus{border-color:var(--accent2);}
.url-row{display:flex;gap:8px;}
.url-row .field-input{flex:1;}
.upload-zone{border:2px dashed var(--border);border-radius:12px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:border-color .2s;overflow:hidden;position:relative;background:var(--bg);}
.upload-zone:hover{border-color:var(--accent2);}
.upload-zone span{font-size:0.75rem;color:var(--muted);z-index:1;}
.upload-icon{font-size:2rem;z-index:1;}
#fileInput{display:none;}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}

/* 배치 큐 */
.batch-queue{margin-top:12px;display:none;}
.batch-item{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:8px;}
.batch-thumb{width:52px;height:66px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.batch-info{flex:1;min-width:0;}
.batch-name{font-size:0.8rem;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.batch-colors{display:flex;gap:4px;margin-bottom:4px;}
.batch-color-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);}
.batch-tags-row{display:flex;flex-wrap:wrap;gap:3px;}
.batch-tag{padding:1px 7px;border-radius:6px;background:var(--tag-bg);font-size:0.62rem;color:var(--muted);border:1px solid var(--border);}
.batch-status{font-size:0.7rem;color:var(--muted);margin-top:3px;}
.batch-status.extracting{color:var(--accent2);}
.batch-status.done{color:#6ab87a;}

/* 분석 중 스피너 */
.spinner-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);display:inline-block;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.2;}}

.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:3rem;margin-bottom:12px;}
.empty p{font-size:0.84rem;line-height:1.6;}
.count-badge{display:inline-block;background:var(--accent2);color:#0f0e0d;border-radius:20px;padding:1px 8px;font-size:0.65rem;font-weight:500;margin-left:6px;}
</style>
</head>
<body>
<nav>
  <div class="nav-tab active" onclick="showPage('recommend')">오늘의 OOTD</div>
  <div class="nav-tab" onclick="showPage('closet')">내 옷장 <span class="count-badge" id="countBadge">0</span></div>
  <div class="nav-tab" onclick="showPage('add')">+ 추가</div>
</nav>

<!-- 추천 -->
<div class="page active" id="page-recommend">
  <div class="sec-title">오늘 뭐 입지?</div>
  <div class="sec-sub">날씨 + 일정 선택하면 내 옷장에서 골라줘요</div>
  <div class="weather-strip">
    <div class="w-icon" id="wIcon">🌤️</div>
    <div class="w-info"><div class="w-temp" id="wTemp">날씨 확인 중...</div><div class="w-desc" id="wDesc"></div></div>
    <div class="w-badge" id="wTag">—</div>
  </div>
  <div class="chip-label">일정</div>
  <div class="chips" id="occasionChips">
    <div class="chip" data-val="출근">출근</div>
    <div class="chip" data-val="데이트">데이트</div>
    <div class="chip" data-val="외출">외출 / 쇼핑</div>
    <div class="chip" data-val="모임">친구 모임</div>
    <div class="chip" data-val="집콕">집콕</div>
  </div>
  <div class="chip-label">원하는 컬러</div>
  <div class="color-chips" id="colorFilterChips"></div>
  <textarea class="free-input" id="freeInput" rows="2" placeholder="추가 조건 (예: 청바지 입고 싶어, 블랙 계열로)"></textarea>
  <button class="btn-big" onclick="recommend()">내 옷장에서 골라줘</button>
  <div class="result-area" id="resultArea"></div>
</div>

<!-- 옷장 -->
<div class="page" id="page-closet">
  <div class="sec-title">My Closet</div>
  <div class="sec-sub">저장된 코디 사진들</div>
  <div class="closet-grid" id="closetGrid"></div>
  <div class="empty" id="closetEmpty">
    <div class="empty-icon">👗</div>
    <p>아직 추가된 코디가 없어요.<br>+ 추가 탭에서 사진을 올려보세요!</p>
  </div>
</div>

<!-- 추가 -->
<div class="page" id="page-add">
  <div class="sec-title">코디 추가</div>
  <div class="sec-sub">사진 올리면 색상 자동 추출 + 일정만 탭하면 끝</div>
  <div class="add-card">
    <div class="field-label">사진 (여러 장 한번에 OK)</div>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📷</div>
      <span>탭해서 사진 선택</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <div class="divider"></div>
    <div class="field-label">또는 이미지 URL</div>
    <div class="url-row">
      <input class="field-input" type="url" id="urlInput" placeholder="https://...">
      <button class="btn-big btn-sm" onclick="addFromUrl()">추가</button>
    </div>

    <!-- 배치 큐 -->
    <div class="batch-queue" id="batchQueue"></div>

    <!-- 공통 일정 태그 -->
    <div id="tagSection" style="display:none">
      <div class="divider"></div>
      <div class="field-label">일정 (전체 적용)</div>
      <div class="chips" id="addOccasionChips">
        <div class="chip" data-val="출근">출근</div>
        <div class="chip" data-val="데이트">데이트</div>
        <div class="chip" data-val="외출">외출 / 쇼핑</div>
        <div class="chip" data-val="모임">친구 모임</div>
        <div class="chip" data-val="집콕">집콕</div>
      </div>
      <div class="field-label">메모 (선택)</div>
      <input class="field-input" type="text" id="memoInput" placeholder="예: 무신사 저장, 여름용">
      <button class="btn-big" onclick="saveAll()">전체 저장하기</button>
    </div>
  </div>
</div>

<script>
// ── 컬러 팔레트 ──────────────────────────────────────
const COLORS = [
  {name:'블랙',hex:'#1a1a1a'},{name:'화이트',hex:'#f0f0eb'},{name:'그레이',hex:'#8a8a8a'},
  {name:'베이지',hex:'#d4c4a8'},{name:'카멜',hex:'#c4956a'},{name:'브라운',hex:'#6b4c3b'},
  {name:'네이비',hex:'#2c3e6b'},{name:'블루',hex:'#5a8ab8'},{name:'데님',hex:'#6b8fa8'},
  {name:'그린',hex:'#6b8a6b'},{name:'카키',hex:'#8a8a5a'},{name:'레드',hex:'#c44a4a'},
  {name:'핑크',hex:'#e8a0b8'},{name:'라벤더',hex:'#b8a0d8'},{name:'옐로우',hex:'#e8d04a'},{name:'오렌지',hex:'#e8904a'},
];

function renderColorChips(id, selected=[]) {
  document.getElementById(id).innerHTML = COLORS.map(c=>`
    <div class="color-chip ${selected.includes(c.name)?'on':''}" style="background:${c.hex}" data-name="${c.name}" title="${c.name}" onclick="this.classList.toggle('on')"></div>`).join('');
}
function getSelectedColors(id) {
  return [...document.querySelectorAll(`#${id} .color-chip.on`)].map(c=>c.dataset.name);
}
renderColorChips('colorFilterChips');

// ── 날씨 ──────────────────────────────────────────────
let W = {temp:null, tempKey:'mild', rain:false};
async function fetchWeather() {
  try {
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));
    const {latitude:lat,longitude:lon} = pos.coords;
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=apparent_temperature,precipitation_probability&timezone=auto&forecast_days=1`);
    const d = await r.json();
    const temp = Math.round(d.current_weather.temperature);
    const code = d.current_weather.weathercode;
    const hr = new Date().getHours();
    const feel = d.hourly?.apparent_temperature?.[hr]!=null?Math.round(d.hourly.apparent_temperature[hr]):temp;
    const rain = (d.hourly?.precipitation_probability?.[hr]??0)>40||[51,53,61,63,80,81,95].includes(code);
    const icons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌧️',95:'⛈️'};
    const descs={0:'맑음',1:'주로 맑음',2:'구름 조금',3:'흐림',45:'안개',51:'이슬비',61:'비',71:'눈',80:'소나기',95:'천둥번개'};
    const tempKey=temp<=5?'cold':temp<=12?'cool':temp<=19?'mild':temp<=24?'warm':'hot';
    const feelLabel=temp<=5?'패딩 필수':temp<=12?'아우터 필수':temp<=19?'가디건 정도':temp<=24?'딱 좋은 날씨':'민소매 각';
    W={temp,feel,tempKey,rain};
    document.getElementById('wIcon').textContent=icons[code]||'🌤️';
    document.getElementById('wTemp').textContent=`${temp}°C  체감 ${feel}°C`;
    document.getElementById('wDesc').textContent=(descs[code]||'맑음')+(rain?' ☔':'');
    document.getElementById('wTag').textContent=feelLabel;
  } catch {
    const m=new Date().getMonth()+1;
    const season=m<=2||m===12?'겨울':m<=5?'봄':m<=8?'여름':'가을';
    W={temp:null,tempKey:'mild',rain:false};
    document.getElementById('wTemp').textContent=season+' 날씨';
    document.getElementById('wDesc').textContent='위치 권한 없음';
    document.getElementById('wTag').textContent=season;
  }
}
fetchWeather();

// ── 페이지 전환 ──────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.nav-tab')[{recommend:0,closet:1,add:2}[id]].classList.add('active');
  if(id==='closet') renderCloset();
}
document.querySelectorAll('.chips').forEach(g=>g.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on'))));

// ── 로컬스토리지 ──────────────────────────────────────
function getOutfits(){try{return JSON.parse(localStorage.getItem('myOutfits')||'[]');}catch{return[];}}
function saveOutfits(arr){localStorage.setItem('myOutfits',JSON.stringify(arr));document.getElementById('countBadge').textContent=arr.length;}
(()=>document.getElementById('countBadge').textContent=getOutfits().length)();

// ── 색상 자동 추출 (캔버스 기반) ──────────────────────
function extractColors(imgEl, topN=5) {
  return new Promise(res=>{
    const canvas = document.createElement('canvas');
    const size = 80;
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    try {
      ctx.drawImage(imgEl, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;
      const buckets = {};
      for(let i=0;i<data.length;i+=16) {
        const r=Math.round(data[i]/32)*32;
        const g=Math.round(data[i+1]/32)*32;
        const b=Math.round(data[i+2]/32)*32;
        if(data[i+3]<128) continue; // 투명 스킵
        const key=`${r},${g},${b}`;
        buckets[key]=(buckets[key]||0)+1;
      }
      // 가장 많이 나온 컬러들을 팔레트에 매핑
      const sorted=Object.entries(buckets).sort((a,b)=>b[1]-a[1]).slice(0,20);
      const matched=new Set();
      for(const [key] of sorted) {
        const [r,g,b]=key.split(',').map(Number);
        const name=matchColor(r,g,b);
        if(name) matched.add(name);
        if(matched.size>=topN) break;
      }
      res([...matched]);
    } catch { res([]); }
  });
}

function matchColor(r,g,b) {
  const targets=[
    {name:'블랙',r:20,g:20,b:20},{name:'화이트',r:240,g:238,b:232},
    {name:'그레이',r:138,g:138,b:138},{name:'베이지',r:212,g:196,b:168},
    {name:'카멜',r:196,g:149,b:106},{name:'브라운',r:107,g:76,b:59},
    {name:'네이비',r:44,g:62,b:107},{name:'블루',r:90,g:138,b:184},
    {name:'데님',r:107,g:143,b:168},{name:'그린',r:107,g:138,b:107},
    {name:'카키',r:138,g:138,b:90},{name:'레드',r:196,g:74,b:74},
    {name:'핑크',r:232,g:160,b:184},{name:'라벤더',r:184,g:160,b:216},
    {name:'옐로우',r:232,g:208,b:74},{name:'오렌지',r:232,g:144,b:74},
  ];
  let best=null, bestDist=Infinity;
  for(const t of targets) {
    const d=Math.sqrt((r-t.r)**2+(g-t.g)**2+(b-t.b)**2);
    if(d<bestDist){bestDist=d;best=t.name;}
  }
  return bestDist<80 ? best : null;
}

// 날씨 자동 추정 (색상 기반 단순 로직)
function guessWeather(colors) {
  const warm=['레드','오렌지','옐로우','핑크'];
  const cool=['네이비','블루','데님','그린','카키'];
  const dark=['블랙','브라운','네이비'];
  if(dark.filter(c=>colors.includes(c)).length>=2) return ['cold','cool','mild'];
  if(warm.filter(c=>colors.includes(c)).length>=1) return ['warm','hot'];
  return ['mild','warm'];
}

// ── 배치 처리 ──────────────────────────────────────────
let batchItems=[];

document.getElementById('fileInput').addEventListener('change', async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  document.getElementById('batchQueue').style.display='block';
  document.getElementById('tagSection').style.display='block';
  for(const file of files) {
    const id=Date.now()+Math.random();
    const imageData=await readFile(file);
    const item={id, imageData, name:file.name.replace(/\.[^.]+$/,''), colors:[], weathers:[], status:'extracting'};
    batchItems.push(item);
    renderBatchItem(item);
    await extractColorsFromData(item);
    renderBatchItem(item);
  }
  e.target.value='';
});

function addFromUrl() {
  const url=document.getElementById('urlInput').value.trim(); if(!url) return;
  const id=Date.now()+Math.random();
  const item={id, imageData:url, name:'URL 코디', colors:[], weathers:[], status:'extracting'};
  batchItems.push(item);
  document.getElementById('batchQueue').style.display='block';
  document.getElementById('tagSection').style.display='block';
  renderBatchItem(item);
  extractColorsFromData(item).then(()=>renderBatchItem(item));
  document.getElementById('urlInput').value='';
}

function readFile(file) {
  return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
}

async function extractColorsFromData(item) {
  return new Promise(res=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=async ()=>{
      item.colors=await extractColors(img);
      item.weathers=guessWeather(item.colors);
      item.status='done';
      res();
    };
    img.onerror=()=>{item.status='done';res();};
    img.src=item.imageData;
  });
}

function renderBatchItem(item) {
  const existing=document.getElementById('bi-'+item.id);
  const colorDots=(item.colors||[]).map(cn=>{const c=COLORS.find(x=>x.name===cn);return c?`<div class="batch-color-dot" style="background:${c.hex}" title="${cn}"></div>`:''}).join('');
  const statusHtml=item.status==='extracting'
    ?`<div class="batch-status extracting"><span class="spinner-dot"></span> 색상 추출 중...</div>`
    :`<div class="batch-status done">✓ 완료 · ${item.colors.join(', ')||'색상 없음'}</div>`;
  const html=`
    <div class="batch-item" id="bi-${item.id}">
      <img class="batch-thumb" src="${item.imageData}" alt="">
      <div class="batch-info">
        <div class="batch-name">${item.name}</div>
        <div class="batch-colors">${colorDots}</div>
        ${statusHtml}
      </div>
      <button onclick="removeBatchItem(${item.id})" style="background:none;border:none;color:var(--danger);font-size:1.1rem;cursor:pointer;padding:4px;">✕</button>
    </div>`;
  if(existing) existing.outerHTML=html;
  else document.getElementById('batchQueue').insertAdjacentHTML('beforeend',html);
}

function removeBatchItem(id) {
  batchItems=batchItems.filter(i=>i.id!==id);
  document.getElementById('bi-'+id)?.remove();
  if(!batchItems.length){
    document.getElementById('batchQueue').style.display='none';
    document.getElementById('tagSection').style.display='none';
  }
}

// ── 저장 ──────────────────────────────────────────────
function saveAll() {
  if(!batchItems.length){alert('사진을 추가해주세요!');return;}
  const occasions=[...document.querySelectorAll('#addOccasionChips .chip.on')].map(c=>c.dataset.val);
  const memo=document.getElementById('memoInput').value.trim();
  const existing=getOutfits();
  const newItems=batchItems.map(item=>({
    id:Date.now()+Math.random(),
    name:item.name,
    image:item.imageData,
    colors:item.colors||[],
    weathers:item.weathers||[],
    occasions,
    memo,
    createdAt:new Date().toLocaleDateString('ko-KR')
  }));
  saveOutfits([...newItems,...existing]);
  const count=newItems.length;
  // 초기화
  batchItems=[];
  document.getElementById('batchQueue').innerHTML='';
  document.getElementById('batchQueue').style.display='none';
  document.getElementById('tagSection').style.display='none';
  document.getElementById('fileInput').value='';
  document.getElementById('urlInput').value='';
  document.getElementById('memoInput').value='';
  document.querySelectorAll('#addOccasionChips .chip').forEach(c=>c.classList.remove('on'));
  alert(count+'개 저장됐어요! 🎉');
  showPage('closet');
}

// ── 옷장 렌더링 ──────────────────────────────────────
function renderCloset() {
  const list=getOutfits();
  const grid=document.getElementById('closetGrid');
  const empty=document.getElementById('closetEmpty');
  if(!list.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=list.map(o=>`
    <div class="closet-item">
      ${o.image?`<img class="closet-img" src="${o.image}" alt="${o.name}" onerror="this.style.display='none'">`:`<div class="closet-img-placeholder">👗</div>`}
      <div class="closet-info">
        <div class="closet-name">${o.name}</div>
        <div class="closet-colors">${(o.colors||[]).slice(0,5).map(cn=>{const c=COLORS.find(x=>x.name===cn);return c?`<div class="closet-color-dot" style="background:${c.hex}" title="${cn}"></div>`:''}).join('')}</div>
        <div class="closet-tags-row">${(o.occasions||[]).map(t=>`<span class="closet-tag">${t}</span>`).join('')}</div>
      </div>
      <button class="closet-del" onclick="deleteOutfit('${o.id}')">✕</button>
    </div>`).join('');
}
function deleteOutfit(id){if(!confirm('삭제할까요?'))return;saveOutfits(getOutfits().filter(o=>String(o.id)!==String(id)));renderCloset();}

// ── 추천 ──────────────────────────────────────────────
function recommend() {
  const list=getOutfits();
  const ra=document.getElementById('resultArea');
  if(!list.length){
    ra.innerHTML=`<div class="empty"><div class="empty-icon">👗</div><p>옷장이 비어있어요!<br>+ 추가 탭에서 코디를 먼저 저장해보세요.</p></div>`;
    return;
  }
  const selOccasions=[...document.querySelectorAll('#occasionChips .chip.on')].map(c=>c.dataset.val);
  const selColors=getSelectedColors('colorFilterChips');
  const ft=document.getElementById('freeInput').value.trim().toLowerCase();

  const scored=list.map(o=>{
    let s=0;
    // 날씨
    const order=['cold','cool','mild','warm','hot'];
    const wi=order.indexOf(W.tempKey);
    if((o.weathers||[]).includes(W.tempKey)) s+=8;
    else (o.weathers||[]).forEach(w=>{const oi=order.indexOf(w);if(Math.abs(wi-oi)===1)s+=3;});
    // 일정
    if(selOccasions.length===0) s+=2;
    else s+=selOccasions.filter(oc=>(o.occasions||[]).includes(oc)).length*5;
    // 컬러
    if(selColors.length>0) s+=selColors.filter(c=>(o.colors||[]).includes(c)).length*3;
    // 텍스트
    if(ft&&(o.name.toLowerCase().includes(ft)||(o.memo||'').toLowerCase().includes(ft))) s+=4;
    // 비
    if(W.rain&&(o.name.includes('코트')||o.name.includes('재킷')||(o.memo||'').includes('방수'))) s+=2;
    s+=Math.random()*1.5;
    return{...o,s};
  });
  scored.sort((a,b)=>b.s-a.s);
  const top=scored.slice(0,2);

  ra.innerHTML=`<div style="font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;">오늘의 픽</div>`;
  top.forEach((o,i)=>{
    const card=document.createElement('div');
    card.className='r-card'; card.style.animationDelay=`${i*0.12}s`;
    const colorDots=(o.colors||[]).map(cn=>{const c=COLORS.find(x=>x.name===cn);return c?`<div class="r-color-dot" style="background:${c.hex}" title="${cn}"></div>`:''}).join('');
    const tags=(o.occasions||[]).map(t=>`<span class="r-tag">${t}</span>`).join('');
    card.innerHTML=`
      <div class="r-card-header">
        <div class="r-card-title">${o.name}</div>
        <div class="r-occasion">${(o.occasions||[])[0]||'—'}</div>
      </div>
      ${o.image?`<img class="r-photo" src="${o.image}" alt="${o.name}">`:`<div class="r-photo-placeholder">👗</div>`}
      <div class="r-body">
        <div class="r-colors">${colorDots}</div>
        <div class="r-tags">${tags}</div>
        ${o.memo?`<div class="r-tip">📝 ${o.memo}</div>`:''}
        ${W.rain?`<div class="r-tip">☔ 비 예보 — 방수 아우터 챙기세요</div>`:''}
      </div>`;
    ra.appendChild(card);
  });
}
